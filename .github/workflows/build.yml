name: Build Dolphin LANplay

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Build Dolphin core (Release)
        run: |
          xcodebuild -project Dolphin.xcodeproj \
            -target Dolphin \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            | xcpretty || cat build/Logs/**/*.log

      - name: Package .zip
        run: |
          PLUGIN="build/Build/Products/Release/Dolphin.oecoreplugin"
          WII="build/Build/Products/Release/Wii.oesystemplugin"
          # fallback if SYMROOT differs
          if [ ! -d "$PLUGIN" ]; then
            PLUGIN=$(find build -name "Dolphin.oecoreplugin" -type d | head -n1)
          fi
          if [ ! -d "$WII" ]; then
            WII=$(find build -name "Wii.oesystemplugin" -type d | head -n1)
          fi
          echo "Plugin: $PLUGIN"
          echo "Wii: $WII"
          ls -R build/Build/Products/Release || true
          mkdir -p dist
          if [ -d "$PLUGIN" ]; then
            ditto -c -k --sequesterRsrc --keepParent "$PLUGIN" "dist/Dolphin-LANplay.oecoreplugin.zip"
          else
            echo "ERROR: Dolphin.oecoreplugin not found"
            exit 1
          fi
          if [ -d "$WII" ]; then
            ditto -c -k --sequesterRsrc --keepParent "$WII" "dist/Wii.oesystemplugin.zip"
            # also bundle both together
            mkdir -p dist/combined
            cp -R "$PLUGIN" dist/combined/
            cp -R "$WII" dist/combined/
            cd dist/combined && zip -r ../Dolphin-LANplay-full.zip . && cd ../..
          fi
          ls -lh dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dolphin-LANplay
          path: dist/*.zip
          retention-days: 30

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
