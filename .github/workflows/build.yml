name: Build Dolphin LANplay

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Create mock OpenEmu frameworks (CI only)
        run: |
          echo "Creating mock OpenEmuBase.framework and OpenEmuSystem.framework"
          mkdir -p OpenEmuBase.framework/Headers
          mkdir -p OpenEmuSystem.framework/Headers
          cat > OpenEmuBase.framework/Headers/OEGameCore.h <<'EOF'
          #import <Foundation/Foundation.h>
          #import <AppKit/AppKit.h>
          #import <OpenGL/gl3.h>
          typedef struct OEIntSize { int width; int height; } OEIntSize;
          static inline OEIntSize OEIntSizeMake(int w, int h) { OEIntSize s={w,h}; return s; }
          typedef NS_ENUM(NSInteger, OEGameCoreRendering) { OEGameCoreRenderingOpenGL3Video = 0 };
          @protocol OEGameCoreRenderingDelegate <NSObject>
          - (void)willRenderFrameOnAlternateThread;
          - (id)presentationFramebuffer;
          - (void)suspendFPSLimiting;
          @end
          @protocol OEAudioBuffer <NSObject>
          @optional
          - (NSUInteger)read:(void *)buffer maxLength:(NSUInteger)len;
          - (NSUInteger)write:(const void *)buffer maxLength:(NSUInteger)len;
          @end
          @class OERingBuffer;
          #define OE_EXPORTED_CLASS
          #define OE_SAMPLERATE 48000
          #define OE_SIZESOUNDBUFFER 4096
          @interface OEGameCore : NSObject <OEAudioBuffer>
          @property (nonatomic, weak) id<OEGameCoreRenderingDelegate> renderDelegate;
          - (instancetype)init;
          - (BOOL)loadFileAtPath:(NSString *)path;
          - (void)startEmulation;
          - (void)stopEmulation;
          - (void)resetEmulation;
          - (void)executeFrame;
          - (void)setPauseEmulation:(BOOL)flag;
          - (BOOL)isEmulationPaused;
          - (NSString *)supportDirectoryPath;
          - (NSString *)systemIdentifier;
          - (OEGameCoreRendering)gameCoreRendering;
          - (BOOL)hasAlternateRenderingThread;
          - (BOOL)needsDoubleBufferedFBO;
          - (const void *)videoBuffer;
          - (NSTimeInterval)frameInterval;
          - (OEIntSize)bufferSize;
          - (OEIntSize)aspectSize;
          - (GLenum)pixelFormat;
          - (GLenum)pixelType;
          - (GLenum)internalPixelFormat;
          - (NSUInteger)channelCount;
          - (double)audioSampleRate;
          - (id<OEAudioBuffer>)audioBufferAtIndex:(NSUInteger)index;
          @end
          EOF
          cat > OpenEmuBase.framework/Headers/OETimingUtils.h <<'EOF'
          #import <Foundation/Foundation.h>
          EOF
          cat > OpenEmuBase.framework/Headers/OEAudioBuffer.h <<'EOF'
          #import <Foundation/Foundation.h>
          @protocol OEAudioBuffer
          @optional
          - (NSUInteger)read:(void *)buffer maxLength:(NSUInteger)len;
          @end
          EOF
          cat > OpenEmuBase.framework/Headers/OERingBuffer.h <<'EOF'
          #import <Foundation/Foundation.h>
          @interface OERingBuffer : NSObject
          @end
          EOF
          cat > OpenEmuSystem.framework/Headers/OpenEmuSystem.h <<'EOF'
          #import <Foundation/Foundation.h>
          EOF
          # Create dummy binaries so linker is happy
          echo "int _oe_dummy=0;" | clang -c -x c -o /tmp/oe_dummy.o -
          libtool -static -o OpenEmuBase.framework/OpenEmuBase /tmp/oe_dummy.o
          libtool -static -o OpenEmuSystem.framework/OpenEmuSystem /tmp/oe_dummy.o
          # Check
          ls -R OpenEmuBase.framework
          ls -R OpenEmuSystem.framework

      - name: Build Dolphin core (Release)
        run: |
          set -o pipefail
          # Show where Xcode will put products
          xcodebuild -project Dolphin.xcodeproj -target Dolphin -configuration Release -showBuildSettings | grep -E "BUILT_PRODUCTS_DIR|SYMROOT|OBJROOT|TARGET_BUILD_DIR" || true
          xcodebuild -project Dolphin.xcodeproj \
            -target Dolphin \
            -configuration Release \
            SYMROOT="$PWD/build" \
            OBJROOT="$PWD/build/obj" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee build.log

      - name: Package .zip
        run: |
          set -x
          echo "=== pwd & ls ==="
          pwd; ls -la
          echo "=== find plugins ==="
          find . -name "Dolphin.oecoreplugin" -type d 2>/dev/null | head -n 20
          find "$HOME/Library/Developer/Xcode/DerivedData" -name "Dolphin.oecoreplugin" -type d 2>/dev/null | head -n 20 || true
          find build -name "Dolphin.oecoreplugin" -type d 2>/dev/null | head -n 20 || true
          PLUGIN=$(find . -name "Dolphin.oecoreplugin" -type d 2>/dev/null | head -n1)
          WII=$(find . -name "Wii.oesystemplugin" -type d 2>/dev/null | head -n1)
          # also check DerivedData
          if [ -z "$PLUGIN" ]; then
            PLUGIN=$(find "$HOME/Library/Developer/Xcode/DerivedData" -name "Dolphin.oecoreplugin" -type d 2>/dev/null | head -n1)
          fi
          if [ -z "$WII" ]; then
            WII=$(find "$HOME/Library/Developer/Xcode/DerivedData" -name "Wii.oesystemplugin" -type d 2>/dev/null | head -n1)
          fi
          echo "Plugin: $PLUGIN"
          echo "Wii: $WII"
          ls -R build 2>/dev/null | head -n 100 || true
          mkdir -p dist
          if [ -d "$PLUGIN" ]; then
            ditto -c -k --sequesterRsrc --keepParent "$PLUGIN" "dist/Dolphin-LANplay.oecoreplugin.zip"
          else
            echo "ERROR: Dolphin.oecoreplugin not found"
            exit 1
          fi
          if [ -d "$WII" ]; then
            ditto -c -k --sequesterRsrc --keepParent "$WII" "dist/Wii.oesystemplugin.zip"
            # also bundle both together
            mkdir -p dist/combined
            cp -R "$PLUGIN" dist/combined/
            cp -R "$WII" dist/combined/
            cd dist/combined && zip -r ../Dolphin-LANplay-full.zip . && cd ../..
          fi
          ls -lh dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dolphin-LANplay
          path: dist/*.zip
          retention-days: 30

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
